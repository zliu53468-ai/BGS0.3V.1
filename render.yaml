services:
  - type: web
    name: v5-1-6-500p-line-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn runtime_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Production follows main automatically. Single-Brain LinUCB V5 is the
    # active decision core. The two mobile ROI values below are late fallbacks
    # used only after the existing venue/profile detectors fail quality gates.
    autoDeploy: true
    disk:
      name: bgs-runtime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BGS_BUILD_LABEL
        value: linucb-single-brain-v5-road-v11-8-mobile-calibrated
      - key: BGS_TARGET_HANDS_MIN
        value: "50"
      - key: BGS_TARGET_HANDS_MAX
        value: "70"
      - key: BGS_CUT_CARD_REMAINING
        value: "70"
      - key: MOBILE_FULLSCREEN_COMPACT_ROI
        value: "0.305,0.738,0.650,0.092"
      - key: MOBILE_FULLSCREEN_WIDE_ROI
        value: "0.290,0.732,0.675,0.105"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ACTIVATION_CODES
        sync: false
      - key: ADMIN_LINE_ID
        value: "@jins888"
      - key: ADMIN_LINE_URL
        value: https://line.me/R/ti/p/%40jins888
      - key: TRIAL_MINUTES
        value: "30"
      - key: RESULT_DELIVERY_MODE
        value: push
      - key: APP_MAX_CONCURRENT_PREDICTIONS
        value: "1"
      - key: OCR_PRELOAD
        value: "0"
      - key: ALLOW_UNSIGNED_WEBHOOK
        value: "0"
      - key: SESSION_DATA_FILE
        value: /var/data/sessions.json

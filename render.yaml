services:
  - type: web
    name: v5-1-6-500p-line-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # 避免 GitHub 上傳未完成檔案時自動替換目前健康版本；改由確認 commit
    # 後在 Render 手動部署。
    autoDeploy: false
    disk:
      name: bgs-runtime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BGS_BUILD_LABEL
        value: cmab-v3-outcome-only-prequential
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ACTIVATION_CODES
        sync: false
      - key: ADMIN_LINE_ID
        value: "@jins888"
      - key: ADMIN_LINE_URL
        value: https://line.me/R/ti/p/%40jins888
      - key: TRIAL_MINUTES
        value: "30"
      - key: RESULT_DELIVERY_MODE
        value: push
      - key: APP_MAX_CONCURRENT_PREDICTIONS
        value: "1"
      - key: OCR_PRELOAD
        value: "0"
      - key: ALLOW_UNSIGNED_WEBHOOK
        value: "0"
      - key: SESSION_DATA_FILE
        value: /var/data/sessions.json

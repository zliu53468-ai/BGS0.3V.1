services:
  - type: web
    name: v5-1-6-500p-line-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # 鎖定手動部署：main 有新 commit 時不會自動把正在使用的模型換掉。
    autoDeploy: false
    disk:
      name: bgs-runtime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # /health 顯示此識別碼，確認 Render 實際跑的是固定的 14:14 基線包。
      - key: BGS_BUILD_LABEL
        value: 14:14-baseline-efea065
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LIFF_ID
        sync: false
      - key: ACTIVATION_CODES
        sync: false
      - key: ADMIN_LINE_ID
        value: "@jins888"
      - key: ADMIN_LINE_URL
        value: https://line.me/R/ti/p/%40jins888
      - key: TRIAL_MINUTES
        value: "30"
      - key: RESULT_DELIVERY_MODE
        value: push
      - key: PREDICT_WORKERS
        value: "2"
      # 這兩項直接對應 app.py 的記憶體保護；避免 EasyOCR 預載與多圖並行 OOM。
      - key: APP_MAX_CONCURRENT_PREDICTIONS
        value: "1"
      - key: OCR_PRELOAD
        value: "0"
      - key: ALLOW_UNSIGNED_WEBHOOK
        value: "0"
      - key: SESSION_DATA_FILE
        value: /var/data/sessions.json
      - key: CMAB_STATE_FILE
        value: /var/data/contextual_bandit_state.json
      - key: PERFORMANCE_DATA_FILE
        value: /var/data/prediction_performance.json
      - key: PF_DECKS
        value: "8"
      - key: SHOE_DECKS
        value: "8"
      - key: BANKER_COMMISSION
        value: "0.05"
      - key: PHYSICAL_MIN_EV
        value: "0.005"
      - key: KELLY_FRACTION
        value: "0.25"
      - key: MAX_BET_FRACTION
        value: "0.02"
      - key: PF_PARTICLES
        value: "500"
      - key: PF_REPLICAS
        value: "5"
      - key: PF_TARGET_MATCHES
        value: "320"
      - key: PF_TARGET_ESS
        value: "210"
      - key: PF_MIN_MATCHES
        value: "40"
      - key: PF_MAX_UPDATE_PROPOSALS
        value: "45000"
      - key: PF_DRAW_PATH_TARGET_MATCHES
        value: "16"
      - key: PF_DRAW_PATH_MIN_MATCHES
        value: "5"
      - key: PF_DRAW_PATH_MIN_ESS
        value: "3"
      - key: PF_MIN_DRAW_PATH_COVERAGE
        value: "0.80"
      - key: PF_DRAW_PATH_UNCERTAINTY
        value: "0.40"
      - key: PF_PREDICT_SIMULATIONS_PER_REPLICA
        value: "600"
      - key: PF_POINT_JOINT_SIMULATIONS_PER_REPLICA
        value: "600"
      - key: PF_SPLIT_UNCERTAINTY
        value: "0.50"
      - key: PF_MIN_EFFECTIVE_REPLICAS
        value: "3.5"
      - key: PF_ADAPTIVE_REPLICA_WEIGHT
        value: "1"
      - key: PF_DATABASE_WEIGHT
        value: "0"
      - key: PF_DATABASE_VALIDATION_MODE
        value: diagnostic
      - key: PF_DECISION_MODE
        value: validated
      - key: PF_UNCERTAINTY_PENALTY
        value: "1.28"
      - key: PF_MIN_VALIDATED_EDGE
        value: "0.0012"
      - key: PF_MIN_REPLICA_AGREEMENT
        value: "0.71"
      - key: PF_RANDOMIZE_EACH_CALL
        value: "1"

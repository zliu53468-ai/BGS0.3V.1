name: Road autolocate and local tester validation

on:
  push:
    branches:
      - fix/road-autolocate-local-tester-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'numpy>=1.26,<2.4'
          'opencv-python-headless==4.12.0.88'
          'fastapi[standard]==0.139.0'
          'pydantic>=2,<3'
          'requests>=2.31,<3'
      - name: Compile changed modules
        run: >-
          python -m py_compile
          road_detector_base_v11_6.py road_detector.py
          local_road_test_app.py test_road_autolocate.py
      - name: Import smoke test
        run: python -c "import road_detector, local_road_test_app; print('road/local tester import ok')"
      - name: Road autolocate tests
        run: python -m unittest -v test_road_autolocate.py
      - name: Existing LinUCB regressions
        run: >-
          python -m unittest -v
          test_tie_freeze_exploit_kelly.py test_linucb_single_brain.py

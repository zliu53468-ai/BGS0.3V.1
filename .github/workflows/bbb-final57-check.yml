name: BBB Final57 parity check

on:
  push:
    branches:
      - sync-bbb-final57-r1
  pull_request:
    branches:
      - main

jobs:
  prediction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.10,<5"
      - name: Syntax check prediction and DG/DB detector
        run: python -m py_compile bbb_final57_runtime.py bbb_v23_hazard_core.py bbb_v23_hazard.py dynamic_prediction_policy.py predictor.py app.py road_detector.py screen_pipeline.py baccarat_vision.py

      - name: DG DB all-screen smoke test
        run: |
          python - <<'PY'
          import cv2, numpy as np, time
          import road_detector as rd

          # DG synthetic desktop/fullscreen: white panel with upper six-row big road.
          dg = np.full((900, 1440, 3), 34, np.uint8)
          px, py, pw, ph = 180, 560, 1120, 250
          cv2.rectangle(dg, (px, py), (px+pw, py+ph), (244,244,242), -1)
          x1, y1, rw, rh = 430, 570, 820, 120
          rows, cols = 6, 24
          cw, ch = rw/cols, rh/rows
          for r in range(rows+1):
              y=int(round(y1+r*ch)); cv2.line(dg,(x1,y),(x1+rw,y),(188,188,188),1)
          for c in range(cols+1):
              x=int(round(x1+c*cw)); cv2.line(dg,(x,y1),(x,y1+rh),(188,188,188),1)
          pts=[(0,0,'B'),(0,1,'B'),(1,0,'P'),(2,0,'B'),(3,0,'P'),(4,0,'B'),(4,1,'B'),(5,0,'P'),(6,0,'B'),(7,0,'P')]
          for c,r,o in pts:
              cx=int(round(x1+(c+.5)*cw)); cy=int(round(y1+(r+.5)*ch))
              color=(35,35,220) if o=='B' else (220,90,35)
              cv2.circle(dg,(cx,cy),7,color,2,cv2.LINE_AA)
          dg_c = rd._dg_white_grid_feature_candidates(dg, deadline=time.perf_counter()+3)
          assert dg_c, "DG all-screen locator failed"
          assert dg_c[0][0][2] > 0.35, dg_c[0]

          # DB synthetic fullscreen: dark board can be anywhere on screen, not just lower mobile area.
          db = np.full((900, 1440, 3), (45,42,48), np.uint8)
          x1, y1 = 330, 290
          pitch_x, pitch_y = 34, 22
          pts=[(0,0,'B'),(0,1,'P'),(1,0,'B'),(1,1,'P'),(2,0,'B'),(3,0,'P'),(4,0,'B'),(5,0,'P'),(6,0,'B'),(7,0,'P'),(8,0,'B')]
          for c,r,o in pts:
              cx=x1+c*pitch_x; cy=y1+r*pitch_y
              color=(28,32,225) if o=='B' else (225,88,35)
              cv2.circle(db,(cx,cy),8,color,2,cv2.LINE_AA)
          db_c = rd._db_dark_ring_feature_candidates(db, deadline=time.perf_counter()+3)
          assert db_c, "DB all-screen locator failed"
          assert db_c[0][0][1] < 0.60, db_c[0]

          print("DG", dg_c[0])
          print("DB", db_c[0])
          PY
      - name: Run Final57 runtime tests
        run: python -m unittest -v test_bbb_final57_runtime.py

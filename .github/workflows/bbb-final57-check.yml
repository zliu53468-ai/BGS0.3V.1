name: BBB Final57 parity check

on:
  push:
    branches:
      - sync-bbb-final57-r1
  pull_request:
    branches:
      - main

jobs:
  prediction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.10,<5"
      - name: Syntax check prediction and image timeout hotfix
        run: python -m py_compile bbb_final57_runtime.py bbb_v23_hazard_core.py bbb_v23_hazard.py dynamic_prediction_policy.py predictor.py app.py road_detector.py screen_pipeline.py baccarat_vision.py road_detector_mt_ofalive_profile.py
      - name: Timed mobile autofocus smoke test
        run: |
          python - <<'PY'
          import time, cv2, numpy as np
          import road_detector as rd
          h, w = 1280, 590
          img = np.full((h, w, 3), 32, np.uint8)
          x1, y1, rw, rh = 55, 820, 500, 145
          cv2.rectangle(img, (x1, y1), (x1+rw, y1+rh), (242,242,240), -1)
          rows, cols = 6, 18
          cw, ch = rw/cols, rh/rows
          for r in range(rows+1):
              y=int(round(y1+r*ch)); cv2.line(img,(x1,y),(x1+rw,y),(185,185,185),1)
          for c in range(cols+1):
              x=int(round(x1+c*cw)); cv2.line(img,(x,y1),(x,y1+rh),(185,185,185),1)
          seq=[(0,0,'B'),(0,1,'B'),(1,0,'P'),(2,0,'B'),(2,1,'B'),(3,0,'P'),(4,0,'B'),(4,1,'B'),(4,2,'B'),(5,0,'P')]
          for c,r,o in seq:
              cx=int(round(x1+(c+.5)*cw)); cy=int(round(y1+(r+.5)*ch))
              color=(35,35,220) if o=='B' else (215,95,35)
              cv2.circle(img,(cx,cy),8,color,2,cv2.LINE_AA)
          t=time.perf_counter()
          candidates=rd._general_road_candidates(img)
          elapsed=time.perf_counter()-t
          assert candidates, "no autofocus candidates"
          assert elapsed < 3.0, elapsed
          print("autofocus_seconds", round(elapsed,3), "top", candidates[0])
          PY
      - name: Run Final57 runtime tests
        run: python -m unittest -v test_bbb_final57_runtime.py

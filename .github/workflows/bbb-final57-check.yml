name: BBB Final57 parity check

on:
  push:
    branches:
      - sync-bbb-final57-r1
  pull_request:
    branches:
      - main

jobs:
  prediction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.10,<5"
      - name: Syntax check prediction and mobile vision
        run: python -m py_compile bbb_final57_runtime.py bbb_v23_hazard_core.py bbb_v23_hazard.py dynamic_prediction_policy.py predictor.py app.py screen_pipeline.py road_detector.py road_detector_mt_ofalive_profile.py baccarat_vision.py room_ocr.py
      - name: Mobile autofocus and reconstruction budget smoke test
        run: |
          python - <<'PY'
          import time, cv2, numpy as np
          import road_detector as rd

          # 直式全畫面 + 白色大路 + 紅藍空心圓
          h, w = 1280, 590
          img = np.full((h, w, 3), 30, np.uint8)
          x1, y1, rw, rh = 50, 820, 500, 145
          cv2.rectangle(img, (x1, y1), (x1+rw, y1+rh), (242,242,240), -1)
          rows, cols = 6, 18
          cw, ch = rw/cols, rh/rows
          for r in range(rows+1):
              y=int(round(y1+r*ch)); cv2.line(img,(x1,y),(x1+rw,y),(185,185,185),1)
          for c in range(cols+1):
              x=int(round(x1+c*cw)); cv2.line(img,(x,y1),(x,y1+rh),(185,185,185),1)
          seq=[(0,0,'B'),(0,1,'B'),(1,0,'P'),(2,0,'B'),(2,1,'B'),(3,0,'P'),(4,0,'B'),(4,1,'B'),(4,2,'B'),(5,0,'P')]
          for c,r,o in seq:
              cx=int(round(x1+(c+.5)*cw)); cy=int(round(y1+(r+.5)*ch))
              color=(35,35,220) if o=='B' else (215,95,35)
              cv2.circle(img,(cx,cy),7,color,1,cv2.LINE_AA)

          t=time.perf_counter()
          candidates=rd._general_road_candidates(img, deadline=time.perf_counter()+2.5)
          elapsed=time.perf_counter()-t
          assert candidates, "autofocus returned no candidates"
          assert elapsed < 2.5, elapsed

          # 反推搜尋必須受 budget 控制
          cells=[]
          for c in range(24):
              for r in range(6):
                  cells.append({"column":c,"row":r,"outcome":"B" if (c+r)%2==0 else "P"})
          t=time.perf_counter()
          details=rd._reconstruct_big_road_order(cells, return_details=True)
          rec_elapsed=time.perf_counter()-t
          assert rec_elapsed < 0.8, rec_elapsed
          assert "search_nodes" in details and "budget_exhausted" in details

          print("autofocus_seconds", round(elapsed,3))
          print("reconstruct_seconds", round(rec_elapsed,3), details.get("search_nodes"), details.get("budget_exhausted"))
          PY
      - name: Run Final57 runtime tests
        run: python -m unittest -v test_bbb_final57_runtime.py

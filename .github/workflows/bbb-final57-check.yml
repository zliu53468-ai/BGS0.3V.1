name: BBB Final57 parity check

on:
  push:
    branches:
      - sync-bbb-final57-r1
  pull_request:
    branches:
      - main

jobs:
  prediction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.10,<5"
      - name: Syntax check prediction and Dream DG detector
        run: python -m py_compile bbb_final57_runtime.py bbb_v23_hazard_core.py bbb_v23_hazard.py dynamic_prediction_policy.py predictor.py app.py road_detector.py baccarat_vision.py

      - name: Dream DG real-layout regression
        run: |
          python - <<'PY'
          import cv2, numpy as np, time
          import road_detector as rd

          def make_screen(y_shift=0, height=1884):
              width=869
              img=np.full((height,width,3),24,np.uint8)
              # white road-paper panel near the supplied screenshot location
              panel_y=1320+y_shift
              cv2.rectangle(img,(0,panel_y),(830,min(height-1,panel_y+330)),(246,246,244),-1)

              # left bead road block to make sure locator doesn't lock it
              for rr in range(6):
                  for cc in range(5):
                      cx=25+cc*36; cy=panel_y+35+rr*35
                      color=(30,30,220) if (rr+cc)%2 else (220,90,35)
                      cv2.circle(img,(cx,cy),12,color,3,cv2.LINE_AA)

              # target DG big road: matches supplied normalized ROI ~ x=.326,y=.732,w=.647,h=.091
              x1=283; y1=1379+y_shift; rw=562; rh=172
              rows, cols=6, 20
              cw, ch=rw/cols, rh/rows
              for r in range(rows+1):
                  y=min(height-1,int(round(y1+r*ch)))
                  cv2.line(img,(x1,y),(min(width-1,x1+rw),y),(188,188,188),1)
              for c in range(cols+1):
                  x=min(width-1,int(round(x1+c*cw)))
                  cv2.line(img,(x,y1),(x,min(height-1,y1+rh)),(188,188,188),1)

              seq=[
                  (0,0,'P'),(1,0,'B'),(1,1,'B'),(2,0,'P'),
                  (3,0,'B'),(3,1,'B'),(3,2,'B'),(4,0,'P'),
                  (5,0,'B'),(6,0,'P'),(6,1,'P'),(7,0,'B'),
                  (8,0,'P'),(9,0,'B'),(10,0,'P'),(11,0,'B'),
                  (12,0,'P'),(13,0,'B')
              ]
              for c,r,o in seq:
                  cx=int(round(x1+(c+.5)*cw)); cy=int(round(y1+(r+.5)*ch))
                  color=(30,30,220) if o=='B' else (220,90,35)
                  # deliberately thin hollow mobile rings
                  cv2.circle(img,(cx,cy),8,color,1,cv2.LINE_AA)

              # right/lower derived roads; should not become target
              for c in range(10):
                  x=650+c*18
                  y=1585+y_shift+(c%3)*18
                  cv2.line(img,(x,y),(x+10,y-10),(220,60,30) if c%2 else (220,120,40),2)
              return img

          for shift in (-75,0,70):
              img=make_screen(shift)
              ratio=img.shape[0]/img.shape[1]
              assert 1.55 <= ratio <= 2.75
              assert rd._looks_like_dream_compact_mobile_fullscreen(img), ("dream signature failed", shift)
              deadline=time.perf_counter()+4.0
              cands=rd._dg_white_grid_feature_candidates(img,deadline=deadline)
              assert cands, ("no DG/Dream feature candidate", shift)
              roi,score=cands[0]
              # Target must be on the right-middle white road paper, not bead road / derived roads.
              assert roi[0] > 0.22, (shift,roi,score)
              assert 0.58 < roi[1] < 0.90, (shift,roi,score)
              assert roi[2] > 0.25, (shift,roi,score)
              assert 0.025 < roi[3] < 0.16, (shift,roi,score)

              x=int(round(roi[0]*img.shape[1])); y=int(round(roi[1]*img.shape[0]))
              w=max(1,int(round(roi[2]*img.shape[1]))); h=max(1,int(round(roi[3]*img.shape[0])))
              crop=img[y:min(img.shape[0],y+h),x:min(img.shape[1],x+w)]
              result=rd._detect_fixed_grid(crop,profile="dg_feature_white_grid",deadline=time.perf_counter()+2.5)
              assert result["recognized_count"] >= 8, (shift,result["recognized_count"],result["fallback_reason"])
              assert result["grid_columns"] >= 15, result["grid_columns"]

          print("dream-dg-regression-ok")
          PY
      - name: Run Final57 runtime tests
        run: python -m unittest -v test_bbb_final57_runtime.py

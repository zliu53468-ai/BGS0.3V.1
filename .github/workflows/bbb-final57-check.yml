name: BBB Final57 parity check

on:
  push:
    branches:
      - sync-bbb-final57-r1
  pull_request:
    branches:
      - main

jobs:
  prediction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<2.4" "opencv-python-headless>=4.10,<5"
      - name: Syntax check prediction and DG detector
        run: python -m py_compile bbb_final57_runtime.py bbb_v23_hazard_core.py bbb_v23_hazard.py dynamic_prediction_policy.py predictor.py app.py road_detector.py

      - name: DG mobile column-order regression
        run: |
          python - <<'PY'
          import numpy as np
          import road_detector as rd

          crop = np.zeros((176, 574, 3), dtype=np.uint8)
          cols = rd._column_candidates(
              crop,
              None,
              profile="dg_feature_white_grid",
          )
          print("dg_column_candidates", cols)
          assert cols[:3] == [20, 19, 21], cols

          # 同比例的電腦版/放大版也應維持同樣幾何欄數。
          crop2 = np.zeros((352, 1148, 3), dtype=np.uint8)
          cols2 = rd._column_candidates(
              crop2,
              None,
              profile="dg_feature_white_grid",
          )
          assert cols2[:3] == [20, 19, 21], cols2
          PY
      - name: Run Final57 runtime tests
        run: python -m unittest -v test_bbb_final57_runtime.py

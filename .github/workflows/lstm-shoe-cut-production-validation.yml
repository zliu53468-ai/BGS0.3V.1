name: LSTM shoe cut production validation

on:
  push:
    branches:
      - feature/lstm-shoe-cut-production-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<2.4' 'tensorflow-cpu==2.21.0'
      - name: Compile prediction core
        run: >-
          python -m py_compile
          lstm_road_model.py
          dynamic_prediction_policy.py
          predictor.py
          shoe_depth_estimator.py
          money_management.py
          shoe_composition.py
      - name: Run focused regressions
        run: >-
          python -m unittest -v
          test_formal_shoe_decision.py
          test_shoe_constants.py
          test_shoe_composition.py
      - name: Run real TensorFlow LSTM smoke
        run: |
          python - <<'PY'
          from lstm_road_model import clear_lstm_model_cache, predict_lstm_road
          clear_lstm_model_cache()
          history = 'BPBPBBPPBPBPBBPPBPBPBBPP'
          result = predict_lstm_road(
              history,
              scope_key='ci-production-shoe',
              shoe_context={
                  'remaining_cards': 285,
                  'remaining_cards_reliability': 0.70,
                  'cut_card_remaining_cards': 70,
              },
              allow_online_update=True,
          )
          assert result['available'] is True
          assert result['direction'] in {'B', 'P'}
          assert abs(result['probabilities']['B'] + result['probabilities']['P'] - 1.0) < 1e-9
          assert result['fusion']['direction_authority'] == 'single_lstm_shoe_cut_fusion'
          assert result['fallback_required'] is False
          print(result['direction'], result['probabilities'], result['fusion'])
          PY
      - name: Verify OCR and screen files untouched
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          for file in room_ocr.py baccarat_vision.py screen_pipeline.py screenshot_predictor.py road_detector.py; do
            if echo "$changed" | grep -Fxq "$file"; then
              echo "Forbidden OCR/screen change: $file"
              exit 1
            fi
          done
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

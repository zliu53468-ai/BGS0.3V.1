name: Final Calibration Data Audit

on:
  push:
    branches:
      - feature/final-calibrated-road-model

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect available historical data
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path('shoe_state_5m.sqlite3')
          print('DB_EXISTS', db.exists(), 'SIZE', db.stat().st_size if db.exists() else 0)
          if db.exists():
              con = sqlite3.connect(str(db))
              print('TABLES', [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")])
              for table in [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]:
                  print('SCHEMA', table, list(con.execute(f'PRAGMA table_info({table})')))
                  try:
                      print('ROWS', table, con.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0])
                  except Exception as exc:
                      print('ROWS_ERROR', table, repr(exc))
              try:
                  print('META', dict(con.execute('SELECT key,value FROM meta')))
              except Exception as exc:
                  print('META_ERROR', repr(exc))
              con.close()

          for candidate in [Path('data/prediction_performance_v3.json'), Path('prediction_performance_v3.json')]:
              print('PERF_FILE', candidate, candidate.exists(), candidate.stat().st_size if candidate.exists() else 0)
              if candidate.exists():
                  payload=json.loads(candidate.read_text(encoding='utf-8'))
                  records=list(payload.get('records') or [])
                  resolved=[r for r in records if str(r.get('actual_outcome') or '').upper() in {'B','P','T'}]
                  shoe_ids={str(r.get('shoe_id') or '') for r in resolved if str(r.get('shoe_id') or '')}
                  print('PERF_RECORDS', len(records), 'RESOLVED', len(resolved), 'SHOES', len(shoe_ids))
          PY

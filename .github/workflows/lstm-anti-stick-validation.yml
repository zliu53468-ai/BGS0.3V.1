name: LSTM anti-stick production validation

on:
  push:
    branches:
      - fix/lstm-anti-stick-fresh-shoe

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<2.4' 'tensorflow-cpu==2.21.0'
      - name: Compile core
        run: >-
          python -m py_compile
          lstm_road_model.py
          dynamic_prediction_policy.py
          predictor.py
          shoe_depth_estimator.py
          money_management.py
          shoe_composition.py
          test_lstm_anti_stick.py
          test_formal_shoe_decision.py
      - name: Run focused regressions
        run: >-
          python -m unittest -v
          test_lstm_anti_stick.py
          test_formal_shoe_decision.py
          test_shoe_constants.py
          test_shoe_composition.py
      - name: Real TensorFlow anti-stick smoke
        run: |
          python - <<'PY'
          from lstm_road_model import clear_lstm_model_cache, predict_lstm_road
          clear_lstm_model_cache()
          history = 'PPPPPPBBPPBPBBPPBPBPBBPP'
          result = predict_lstm_road(
              history,
              scope_key='ci-anti-stick',
              shoe_context={
                  'remaining_cards': 285,
                  'remaining_cards_reliability': 0.70,
                  'cut_card_remaining_cards': 70,
              },
              allow_online_update=True,
          )
          assert result['available'] is True
          assert result['direction'] in {'B', 'P'}
          assert result['fusion']['structure_weight'] == 0.0
          assert result['features']['structure_logit'] == 0.0
          assert result['training_balance']['symmetry_augmented'] is True
          assert result['training_balance']['augmented_b_samples'] == result['training_balance']['augmented_p_samples']
          assert abs(result['probabilities']['B'] + result['probabilities']['P'] - 1.0) < 1e-9
          print(result['direction'], result['probabilities'], result['neural'], result['training_balance'])
          PY
      - name: Verify OCR screen files untouched
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          for file in room_ocr.py baccarat_vision.py screen_pipeline.py screenshot_predictor.py road_detector.py; do
            if echo "$changed" | grep -Fxq "$file"; then
              echo "Forbidden OCR/screen change: $file"
              exit 1
            fi
          done
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

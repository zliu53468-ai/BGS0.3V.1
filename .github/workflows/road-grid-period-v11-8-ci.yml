name: Road grid period V11.8 validation

on:
  push:
    branches:
      - fix/road-grid-period-v11-8

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2.4' opencv-python-headless
      - name: Compile road detector
        run: python -m py_compile road_detector.py road_detector_base_v11_6.py test_road_autolocate.py
      - name: Road adaptive-grid regressions
        run: python -m unittest -v test_road_autolocate.py
      - name: Existing Single-Brain regressions
        run: python -m unittest -v test_linucb_single_brain.py test_tie_freeze_exploit_kelly.py

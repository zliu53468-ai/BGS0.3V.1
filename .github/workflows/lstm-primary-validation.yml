name: LSTM primary validation

on:
  push:
    branches:
      - feature/lstm-road-primary
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependency
        run: python -m pip install 'numpy>=1.26,<2.4'
      - name: Compile prediction core
        run: >-
          python -m py_compile
          lstm_road_model.py
          dynamic_prediction_policy.py
          predictor.py
          run_length_hazard.py
          hsmm_regime.py
          pattern_survival.py
          shoe_depth_estimator.py
      - name: Run focused regressions
        run: >-
          python -m unittest -v
          test_formal_shoe_decision.py
          test_shoe_constants.py
          test_shoe_composition.py
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

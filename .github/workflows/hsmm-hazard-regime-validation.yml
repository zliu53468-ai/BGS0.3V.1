name: HSMM Hazard Regime validation

on:
  push:
    branches:
      - feature/hsmm-hazard-regime-gate-prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependency
        run: python -m pip install 'numpy>=1.26,<2.4'
      - name: Compile production core
        run: >-
          python -m py_compile
          road_pattern_v1_core.py
          road_pattern_core.py
          road_regime_gate.py
          run_length_hazard.py
          derived_road_markov.py
          derived_road_geometry.py
          road_model.py
          dynamic_prediction_policy.py
          predictor.py
          shoe_depth_estimator.py
          money_management.py
          shoe_composition.py
      - name: Run full road and API regressions
        run: >-
          python -m unittest -v
          test_road_pattern_primary.py
          test_human_derived_road.py
          test_derived_road_geometry.py
          test_road_regime_gate.py
          test_formal_shoe_decision.py
          test_shoe_constants.py
          test_shoe_composition.py
      - name: Verify exact V1 core remains unchanged
        run: |
          test "$(git rev-parse HEAD:road_pattern_v1_core.py)" = "$(git rev-parse c2534434c8b6af26ab42779dee268b8d15cb223b:road_pattern_v1_core.py)"
      - name: Verify auxiliary caps and contracts
        run: |
          python - <<'PY'
          from derived_road_geometry import MAX_GEOMETRY_RELIABILITY
          from derived_road_markov import MAX_DERIVED_ROAD_RELIABILITY
          from road_regime_gate import MAX_REGIME_DIRECTION_WEIGHT
          from road_pattern_core import forecast_road_pattern
          assert MAX_GEOMETRY_RELIABILITY <= 0.10
          assert MAX_DERIVED_ROAD_RELIABILITY <= 0.18
          assert MAX_REGIME_DIRECTION_WEIGHT <= 0.12
          r = forecast_road_pattern('BPBBPBPBBPPBPBBPBPBBPPBPBBPBP')
          assert r['derived_direction_weight'] <= 0.18
          assert r['regime_direction_weight'] <= 0.12
          assert set(r['components']) == {'multi_window','pattern_replay','ngram','pattern_survival'}
          assert r['direction_authority'] == 'road_pattern_v1_plus_human_derived_ask_road'
          assert 'regime_gate' in r and 'hazard' in r['regime_gate']
          assert r['regime_gate']['direction_authority'] == 'capped_residual_only'
          print(r['v1_probabilities'])
          print(r['derived_ask_road_fusion'])
          print(r['regime_gate'])
          print(r['regime_gate_fusion'])
          PY
      - name: Verify OCR and screenshot sources untouched
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          for file in room_ocr.py baccarat_vision.py screen_pipeline.py screenshot_predictor.py road_detector.py; do
            if echo "$changed" | grep -Fxq "$file"; then
              echo "Forbidden OCR/screen change: $file"
              exit 1
            fi
          done
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

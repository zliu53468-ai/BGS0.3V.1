name: Context 8x8 validation

on:
  push:
    branches:
      - refactor/context-8shoe-8road

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2.4'
      - name: Compile contextual bandit
        run: python -m py_compile contextual_bandit.py
      - name: Validate 8 shoe + 8 road layout
        run: |
          python - <<'PY'
          import math
          import contextual_bandit as cb

          assert cb.CONTEXT_DIM == 16
          expected = (
              'remaining_cards_ratio',
              'shoe_A23_relative_ratio',
              'shoe_45_relative_ratio',
              'shoe_6_relative_ratio',
              'shoe_7_relative_ratio',
              'shoe_8_relative_ratio',
              'shoe_9_relative_ratio',
              'shoe_10JQK_relative_ratio',
              'current_side_banker_binary',
              'current_run_length_norm',
              'recent8_banker_ratio',
              'recent8_turn_rate',
              'run_length_hazard_rate',
              'hsmm_stable_probability',
              'big_eye_regularity',
              'small_cockroach_regularity',
          )
          assert cb.CONTEXT_FEATURE_NAMES == expected
          assert '8SHOE-8ROAD' in cb.STATE_VERSION

          cb.analyze_shoe_composition = lambda ctx, default_decks=8: {
              'available': True,
              'remaining_counts': [128, 32, 32, 32, 32, 32, 32, 32, 32, 32],
              'remaining_cards_source': 'test_exact',
          }
          cb.fresh_counts = lambda decks: [128, 32, 32, 32, 32, 32, 32, 32, 32, 32]
          cb.estimate_probabilistic_shoe = lambda *a, **k: {
              'bp_conditional_probabilities': {'B': 0.5, 'P': 0.5},
              'reliability': 1.0,
          }
          cb.update_and_predict_engine = lambda history: {}
          cb.analyze_hidden_regime = lambda state: {'stable_probability': 0.7}
          cb.analyze_run_length_hazard = lambda history: {'turn_probability': 0.3}
          cb.build_standard_derived_roads = lambda history: {
              'big_eye': ['R', 'U', 'R', 'R'],
              'small_road': ['R', 'R'],
              'cockroach_road': ['U', 'R'],
          }

          snap = cb.ContextGenerator().build('BPPBBPBP', {'decks': 8})
          x = snap.vector.tolist()
          assert len(x) == 16
          assert all(abs(v - 1.0) < 1e-12 for v in x[:8])
          expected_road = [0.0, 0.125, 0.5, 5.0/7.0, 0.3, 0.7, 0.75, 0.75]
          for actual, wanted in zip(x[8:], expected_road):
              assert math.isclose(actual, wanted, rel_tol=0.0, abs_tol=1e-9), (actual, wanted)
          assert snap.metadata['context_layout'] == '8_shoe_plus_8_road'
          assert len(snap.metadata['shoe_feature_values']) == 8
          assert len(snap.metadata['road_feature_values']) == 8
          print('8x8 context validation OK')
          PY

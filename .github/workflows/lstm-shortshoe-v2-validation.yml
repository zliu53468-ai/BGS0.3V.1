name: LSTM short-shoe v2 validation

on:
  push:
    branches:
      - feature/lstm-shoe-shortshoe-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install 'numpy>=1.26,<2.4'
      - name: Compile modified prediction files
        run: >-
          python -m py_compile
          lstm_road_model.py
          shoe_depth_estimator.py
          pattern_survival.py
          test_formal_shoe_decision.py
      - name: Run focused regressions
        run: >-
          python -m unittest -v
          test_formal_shoe_decision.py
          test_shoe_constants.py
          test_shoe_composition.py
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

name: LinUCB V5 validation

on:
  push:
    branches:
      - refactor/linucb-single-brain-v5

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2.4'
      - name: Compile modified core
        run: >-
          python -m py_compile
          contextual_bandit.py
          dynamic_prediction_policy.py
          predictor.py
          validated_decision_layer.py
          app.py
          test_linucb_single_brain.py
      - name: Shoe composition regression
        run: python -m unittest -v test_shoe_composition.py
      - name: Derived road geometry regression
        run: python -m unittest -v test_derived_road_geometry.py
      - name: Single brain regression
        run: python -m unittest -v test_linucb_single_brain.py

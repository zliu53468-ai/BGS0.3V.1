name: Context 32D validation

on:
  push:
    branches:
      - refactor/context-16shoe-16road-32d

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2.4'
      - name: Compile contextual bandit
        run: python -m py_compile contextual_bandit.py
      - name: Validate 16 shoe + 16 road layout
        run: |
          python - <<'PY'
          import math
          import contextual_bandit as cb

          expected = (
              'remaining_cards_ratio','penetration_ratio','estimated_hands_remaining_norm','shoe_maturity_ratio',
              'rank_A_relative_ratio','rank_2_relative_ratio','rank_3_relative_ratio','rank_4_relative_ratio',
              'rank_5_relative_ratio','rank_6_relative_ratio','rank_7_relative_ratio','rank_8_relative_ratio',
              'rank_9_relative_ratio','rank_10JQK_relative_ratio','physical_edge_proxy','shoe_information_reliability',
              'current_side_banker_binary','current_run_length_norm','previous_run_length_norm','previous2_run_length_norm',
              'recent5_banker_ratio','recent8_banker_ratio','recent12_banker_ratio','recent5_turn_rate',
              'recent8_turn_rate','recent12_turn_rate','run_length_hazard_rate','hsmm_stable_probability',
              'big_eye_regularity','small_road_regularity','cockroach_road_regularity','derived_road_consensus',
          )
          assert cb.CONTEXT_DIM == 32
          assert cb.CONTEXT_FEATURE_NAMES == expected
          assert '16SHOE-16ROAD-32D' in cb.STATE_VERSION

          cb.analyze_shoe_composition = lambda ctx, default_decks=8: {'available': False}
          cb.estimate_probabilistic_shoe = lambda *a, **k: {
              'bp_conditional_probabilities': {'B': 0.5, 'P': 0.5}, 'reliability': 0.0,
          }
          cb.update_and_predict_engine = lambda history: {}
          cb.analyze_hidden_regime = lambda state: {'stable_probability': 0.7}
          cb.analyze_run_length_hazard = lambda history: {'turn_probability': 0.3}
          cb.build_standard_derived_roads = lambda history: {
              'big_eye': ['R','U','R','R'],
              'small_road': ['R','R'],
              'cockroach_road': ['U','R'],
          }
          snap = cb.ContextGenerator().build('BPPBBPBP', {'decks': 8})
          x = snap.vector.tolist()
          assert len(x) == 32
          assert len(snap.metadata['shoe_feature_values']) == 16
          assert len(snap.metadata['road_feature_values']) == 16
          assert snap.metadata['context_layout'] == '16_shoe_plus_16_road_32d'
          assert x[4:14] == [1.0] * 10
          assert x[14] == 0.0 and x[15] == 0.0
          assert x[16] == 0.0
          assert math.isclose(x[17], 0.125, abs_tol=1e-9)
          assert math.isclose(x[20], 0.4, abs_tol=1e-9)
          assert math.isclose(x[21], 0.5, abs_tol=1e-9)
          assert math.isclose(x[23], 0.75, abs_tol=1e-9)
          assert math.isclose(x[24], 5.0/7.0, abs_tol=1e-9)
          assert math.isclose(x[26], 0.3, abs_tol=1e-9)
          assert math.isclose(x[27], 0.7, abs_tol=1e-9)
          assert math.isclose(x[28], 0.75, abs_tol=1e-9)
          assert math.isclose(x[29], 1.0, abs_tol=1e-9)
          assert math.isclose(x[30], 0.5, abs_tol=1e-9)
          print('32D layout OK')
          PY
      - name: LinUCB 32D matrix smoke
        run: |
          python - <<'PY'
          import numpy as np
          import contextual_bandit as cb
          arm = {'A': np.eye(32).tolist(), 'b': np.zeros(32).tolist(), 'n': 0, 'effective_n': 0.0}
          score = cb.ContextualLinUCB()._score(arm, np.ones(32), 1.0)
          assert set(('score','mean','uncertainty')).issubset(score)
          assert score['uncertainty'] > 0
          print('32x32 LinUCB score OK')
          PY
